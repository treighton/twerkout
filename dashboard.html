<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twerkout — Training Dashboard</title>
<!-- Chart.js pinned to an exact version with Subresource Integrity (SRI).
     The browser refuses to run the script if its hash doesn't match, so a
     compromised CDN can't inject code. -->
<script
  src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"
  integrity="sha384-Sse/HDqcypGpyTDpvZOJNnG0TT3feGQUkF9H+mnRvic+LjR+K1NhTt8f51KIQ3v3"
  crossorigin="anonymous"></script>
<style>
  :root { font-family: system-ui, sans-serif; }
  body { padding: 1rem; max-width: 900px; margin: 0 auto; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .summary { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
  .card { background: #f4f4f5; border-radius: 8px; padding: 0.75rem 1rem; flex: 1 1 140px; }
  .card .label { font-size: 0.75rem; color: #666; text-transform: uppercase; }
  .card .value { font-size: 1.3rem; font-weight: 600; }
  canvas { margin: 1rem 0; }
  details { margin: 0.5rem 0; border: 1px solid #e4e4e7; border-radius: 8px; padding: 0.5rem 0.75rem; }
  summary { cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #eee; }
  .met-Yes { color: #16a34a; } .met-No { color: #dc2626; }
</style>
</head>
<body>
<h1>Twerkout — Week 1</h1>

<section class="summary">
  <div class="card"><div class="label">Total Zone 2 min</div><div class="value">0</div></div>
  
  <div class="card"><div class="label">e1RM squat</div><div class="value">—</div></div>
  
  <div class="card"><div class="label">e1RM press</div><div class="value">—</div></div>
  
  <div class="card"><div class="label">e1RM bench</div><div class="value">—</div></div>
  
  <div class="card"><div class="label">e1RM deadlift</div><div class="value">—</div></div>
  
  <div class="card"><div class="label">Recovery</div><div class="value">—</div></div>
</section>

<canvas id="e1rmChart" height="120"></canvas>
<canvas id="zone2Chart" height="120"></canvas>
<canvas id="recoveryChart" height="120"></canvas>

<details>
  <summary>Strength (derived)</summary>
  <table>
    <tr><th>Date</th><th>Wk</th><th>e1RM Sq</th><th>e1RM Pr</th><th>e1RM Be</th><th>e1RM Dl</th></tr>
    
  </table>
</details>

<details>
  <summary>Zone 2 (derived)</summary>
  <table>
    <tr><th>Date</th><th>Wk</th><th>Planned</th><th>Met?</th></tr>
    
  </table>
</details>

<details>
  <summary>Ruck (derived)</summary>
  <table>
    <tr><th>Date</th><th>Wk</th><th>Load</th><th>Met?</th></tr>
    
  </table>
</details>

<details>
  <summary>Hill (derived)</summary>
  <table>
    <tr><th>Date</th><th>Wk</th><th>Planned</th><th>Met?</th></tr>
    
  </table>
</details>

<details>
  <summary>Recovery (derived)</summary>
  <table>
    <tr><th>Week</th><th>Score</th><th>Status</th></tr>
    
  </table>
</details>

<script id="data" type="application/json">{"program": [{"week": 1, "zone2_planned_min": 30.0, "ruck_planned_min": 30.0, "ruck_planned_weight": 20.0, "hill_planned_repeats": 4.0, "notes": "Start easy; run uphill / walk downhill"}, {"week": 2, "zone2_planned_min": 30.0, "ruck_planned_min": 30.0, "ruck_planned_weight": 20.0, "hill_planned_repeats": 5.0, "notes": ""}, {"week": 3, "zone2_planned_min": 35.0, "ruck_planned_min": 40.0, "ruck_planned_weight": 20.0, "hill_planned_repeats": 6.0, "notes": ""}, {"week": 4, "zone2_planned_min": 35.0, "ruck_planned_min": 40.0, "ruck_planned_weight": 20.0, "hill_planned_repeats": 7.0, "notes": ""}, {"week": 5, "zone2_planned_min": 40.0, "ruck_planned_min": 45.0, "ruck_planned_weight": 25.0, "hill_planned_repeats": 8.0, "notes": ""}, {"week": 6, "zone2_planned_min": 40.0, "ruck_planned_min": 45.0, "ruck_planned_weight": 25.0, "hill_planned_repeats": 8.0, "notes": "Hold volume if recovery is poor"}, {"week": 7, "zone2_planned_min": 45.0, "ruck_planned_min": 60.0, "ruck_planned_weight": 25.0, "hill_planned_repeats": 9.0, "notes": ""}, {"week": 8, "zone2_planned_min": 45.0, "ruck_planned_min": 60.0, "ruck_planned_weight": 25.0, "hill_planned_repeats": 10.0, "notes": ""}, {"week": 9, "zone2_planned_min": 50.0, "ruck_planned_min": 60.0, "ruck_planned_weight": 35.0, "hill_planned_repeats": 10.0, "notes": ""}, {"week": 10, "zone2_planned_min": 50.0, "ruck_planned_min": 60.0, "ruck_planned_weight": 35.0, "hill_planned_repeats": 10.0, "notes": ""}, {"week": 11, "zone2_planned_min": 50.0, "ruck_planned_min": 75.0, "ruck_planned_weight": 35.0, "hill_planned_repeats": 10.0, "notes": ""}, {"week": 12, "zone2_planned_min": 50.0, "ruck_planned_min": 75.0, "ruck_planned_weight": 35.0, "hill_planned_repeats": 10.0, "notes": "Peak template week"}], "strength": [], "zone2": [], "ruck": [], "hill": [], "recovery": [], "summary": {"current_week": 1, "total_zone2_min": 0, "latest_e1rm": {"squat": null, "press": null, "bench": null, "deadlift": null}, "latest_recovery_status": ""}, "e1rm_series": {"squat": [], "press": [], "bench": [], "deadlift": []}, "zone2_volume": {}, "ruck_volume": {}, "hill_volume": {}}</script>
<script>
const VIEW = JSON.parse(document.getElementById("data").textContent);

function lineChart(id, datasets) {
  new Chart(document.getElementById(id), {
    type: "line",
    data: { datasets },
    options: {
      parsing: { xAxisKey: "date", yAxisKey: "value" },
      scales: { x: { type: "category" } },
    },
  });
}

// e1RM over time — one dataset per lift
const e1 = VIEW.e1rm_series;
lineChart("e1rmChart", Object.keys(e1).map(lift => ({
  label: lift,
  data: e1[lift],
})));

// Zone 2 weekly volume — planned vs actual bars
const zv = VIEW.zone2_volume;
const weeks = Object.keys(zv);
new Chart(document.getElementById("zone2Chart"), {
  type: "bar",
  data: {
    labels: weeks.map(w => "Wk " + w),
    datasets: [
      { label: "Zone2 actual", data: weeks.map(w => zv[w].actual) },
      { label: "Zone2 planned", data: weeks.map(w => zv[w].planned) },
    ],
  },
});

// Recovery score per week
const rec = VIEW.recovery.filter(r => r.score !== null);
new Chart(document.getElementById("recoveryChart"), {
  type: "line",
  data: {
    labels: rec.map(r => "Wk " + r.week),
    datasets: [{ label: "Recovery score", data: rec.map(r => r.score) }],
  },
});
</script>
</body>
</html>
